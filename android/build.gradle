buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")

        // Phone push (FCM): the google-services plugin turns android/app/google-services.json into the
        // Firebase resources. It is only put on the classpath when that file exists (and only applied in
        // app/build.gradle under the same condition), so a checkout without the file still builds, just
        // without Firebase. Version = the one @react-native-firebase/app 26.x is tested with.
        if (file("app/google-services.json").exists()) {
            classpath("com.google.gms:google-services:4.5.0")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

// NOTE: this checkout lives on an exFAT external drive (can't hold macOS's
// per-file metadata, so every Gradle-written file gets a shadow "._name"
// AppleDouble companion, breaking AAPT and directory deletion). We relocate
// build output off it via symlinks (android/build, android/app/build, each
// node_modules/*/android/build — see scripts/relocate-android-build-dirs.sh),
// NOT via project.buildDir: overriding buildDir here breaks CMake autolinking,
// which hardcodes real "node_modules/<pkg>/android/build/..." paths that a
// Gradle-only property change doesn't follow. Symlinks keep those paths
// resolving exactly as before while the bytes live on APFS.

// react-native-print 0.11.0 (2023) ships a stale Android build file (compileSdk/buildTools 31,
// targetSdk 29) that fails :checkReleaseAarMetadata against react-android's minCompileSdk. Align
// that one library with the app's SDK levels. Registered here so it runs before AGP finalises the
// library's variants.
// (:app is already evaluated by the React root-project plugin, so only touch that one project.)
subprojects { sub ->
    if (sub.name == 'react-native-print') {
        sub.afterEvaluate {
            if (sub.plugins.hasPlugin('com.android.library')) {
                sub.android {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                    buildToolsVersion rootProject.ext.buildToolsVersion
                }
            }
        }
    }
}
